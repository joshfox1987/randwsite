<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Gallery</title>
    <script defer src="/__/firebase/12.9.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f0f0; }
        h1 { text-align: center; color: #333; }
        #gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 10px; }
        .gallery-item { border: 1px solid #ccc; background-color: #fff; padding: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .gallery-item img { max-width: 200px; max-height: 200px; display: block; }
    </style>
</head>
<body>
    <h1>Image Gallery</h1>
    <div id="gallery"></div>
    <script src="main.js"></script>
</body>
</html>
